<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FOGs</title>
  <link rel="stylesheet" href="/css/panel.css">
  <script type="module" src="/js/settings.js"></script>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Разделы">
    <div class="brand">FOGs</div>
    <a href="#images" data-page="images">Образы</a>
    <a href="#settings" data-page="settings">Настройки</a>
    <div class="link"><span class="dot off" id="dot"></span><span id="link">подключение…</span></div>
  </nav>
  <main>
    <div id="error" role="alert"></div>
    <div class="page" id="page-images">
      <h1>Образы</h1>
      <section>
        <div class="head">
          <h2>Сохранённые образы <span class="count" id="imageCount"></span></h2>
          <button type="button" id="scan">Сканировать</button>
        </div>
        <table id="imageTable" hidden>
          <thead><tr><th>Образ</th><th>Версия</th><th>Слоёв</th><th aria-label="Действия"></th></tr></thead>
          <tbody id="images"></tbody>
        </table>
        <div class="empty" id="noImages" hidden>Образов пока нет. Укажите папку в настройках и запустите сканирование.</div>
        <div class="field" id="scanResult" role="status" hidden></div>
      </section>
    </div>
    <div class="page" id="page-settings" hidden>
      <h1>Настройки</h1>
      <section>
        <div class="head"><h2>Хранилище</h2></div>
        <form class="field" id="settingsForm">
          <label for="imageDir">Папка образов</label>
          <div class="row">
            <input id="imageDir" placeholder="D:\locless-images" required>
            <button class="main" type="submit">Сохранить</button>
          </div>
          <p id="imageDirNote" role="status">Укажите существующую папку с образами.</p>
        </form>
      </section>
    </div>
  </main>
</div>
<dialog id="imageDialog" class="wide" aria-labelledby="imageTitle">
  <h2 id="imageTitle"></h2>
  <div class="metrics" id="imageDetails"></div>
  <form method="dialog">
    <div class="buttons"><button>Закрыть</button></div>
  </form>
</dialog>
</body>
</html>
